# ============================================================
# GitHub Actions - Validación de código Python en Pull Requests
# Proyecto: TeleConecta Churn Analysis
# ============================================================

name: Validación de Código Python

# Cuándo se ejecuta este workflow
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validar-codigo:
    name: Validar sintaxis y dependencias
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Validar sintaxis Python (que el código no esté roto)
      - name: Validar sintaxis Python
        run: |
          python -m py_compile scraper_planes.py
          python -m py_compile scraper_completo.py
          python -m py_compile config.py
          echo "✓ Sintaxis correcta en todos los archivos Python"

      # 5. Linter (estilo de código)
      - name: Ejecutar flake8 (linter)
        run: |
          # Solo reporta errores críticos (sintaxis, indentación), no avisos de estilo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ Linter pasó sin errores críticos"

      # 6. Mensaje final
      - name: Resumen
        run: echo "🎉 Todas las validaciones pasaron correctamente"
